<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inky compositor</title>
<style>
@font-face { font-family: 'Geist'; font-weight: 100 900; src: url(fonts/geist-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Geist'; font-weight: 100 900; src: url(fonts/geist-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url(fonts/geistmono-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url(fonts/geistmono-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root {
  --ink: #141413; --ground: #F7F6F3; --coral: #E86F51; --coral-ink: #C2502F; --grey: #6B6862;
  --line: #E8E6E1; --well: #EFEDE8; --edge: #D9D6CF; --dark: #141413;
  --sans: 'Geist', -apple-system, 'SF Pro Text', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--dark); overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); transform-origin: 0 0; }
.shot, .world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.shot { display: none; overflow: hidden; }
.shot.screen { background: var(--ground); }
.shot.phone { background: var(--dark); }
.frame { position: absolute; overflow: hidden; border-radius: 12px; background: #FFFFFF;
  box-shadow: 0 1px 2px rgba(20,20,19,.06), 0 12px 40px rgba(20,20,19,.12); }
.frame.bleed { border-radius: 0; box-shadow: none; }
.frame img, .pscreen img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.handset { position: absolute; background: #0B0B0A; border-radius: 64px; padding: 14px;
  box-shadow: 0 0 0 1.5px #2A2927, 0 30px 80px rgba(0,0,0,.45); }
.pscreen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #FFFFFF; }
.placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--well); border: 2px dashed var(--edge); border-radius: inherit; font-family: var(--mono); color: var(--grey); text-align: center; padding: 40px; }
.placeholder b { font-size: 30px; font-weight: 500; color: var(--ink); }
.placeholder span { font-size: 20px; max-width: 900px; line-height: 1.4; }
.card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: var(--dark); color: #FFFFFF; }
.card.light { background: var(--ground); color: var(--ink); }
.card.light h1 { font-size: 150px; font-weight: 600; letter-spacing: -0.04em; }
.cardin { display: flex; align-items: center; gap: 44px; }
.cardin .logo { width: 190px; height: 190px; }
.card h1 { margin: 0; font-size: 84px; font-weight: 500; letter-spacing: -0.025em; }
.card p { margin: 0; font-size: 30px; color: rgba(255,255,255,.62); }
.card.light p { color: var(--grey); }
.ov { position: absolute; left: 0; top: 0; display: none; }
.caption { position: absolute; left: 50%; bottom: 60px; display: none; transform: translateX(-50%); max-width: 1480px; width: max-content;
  padding: 12px 26px 13px; border-radius: 16px; background: rgba(20,20,19,.80); color: #FFFFFF; text-align: center;
  font-size: 36px; font-weight: 500; line-height: 1.32; letter-spacing: -0.005em; white-space: pre-line; }
.lower { left: 88px; top: auto; bottom: 64px; max-width: 1040px; padding: 20px 28px 22px; border-radius: 14px; background: #FFFFFF;
  box-shadow: 0 1px 2px rgba(20,20,19,.08), 0 14px 40px rgba(20,20,19,.16); }
.lower small, .stamp, .counter small, .hl-label { font-family: var(--mono); }
.lower small { display: flex; align-items: center; gap: 10px; font-size: 17px; color: var(--grey); letter-spacing: .02em; text-transform: uppercase; }
.lower div { margin-top: 8px; font-size: 29px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); flex: none; }
.stamp { display: none; align-items: center; gap: 12px; padding: 11px 18px; border-radius: 999px; background: #FFFFFF; font-size: 20px; font-weight: 500;
  border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(20,20,19,.12); white-space: nowrap; }
.stamp.big { font-family: var(--sans); font-size: 26px; padding: 13px 22px; }
.counter { top: auto; left: 88px; bottom: 64px; padding: 22px 34px 24px; border-radius: 16px; background: #FFFFFF;
  box-shadow: 0 1px 2px rgba(20,20,19,.08), 0 16px 44px rgba(20,20,19,.18); }
.counter .row { display: flex; align-items: flex-end; }
.counter .item { display: flex; align-items: baseline; gap: 12px; padding: 0 30px; border-left: 1px solid var(--line); }
.counter .item:first-child { padding-left: 0; border-left: 0; }
.counter .item:last-child { padding-right: 0; }
.counter b { font-size: 76px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.counter span { font-size: 28px; color: var(--grey); }
.counter small { display: block; margin-top: 14px; font-size: 17px; color: var(--grey); text-transform: uppercase; letter-spacing: .02em; }
.hl { border: 3px solid var(--coral); border-radius: 14px; box-shadow: 0 0 0 6px rgba(232,111,81,.16); }
.hl.nobox { border-color: transparent; box-shadow: none; }
.hl-label { position: absolute; display: none; padding: 9px 16px; border-radius: 10px; background: var(--ink); color: #FFFFFF; font-size: 21px; white-space: nowrap; }
.cursor { width: 40px; height: 40px; transform-origin: 0 0; }
.ripple { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(20,20,19,.55); background: rgba(20,20,19,.10); }
.caption .kw { color: #F08A70; }
.cardin .logo svg, .endhead .logo svg { width: 100%; height: 100%; display: block; }
.endcard { padding: 0; }
.endin { display: flex; gap: 90px; align-items: center; width: 1640px; }
.endl { flex: 1; }
.endhead { display: flex; align-items: center; gap: 20px; }
.endhead .logo { width: 96px; height: 96px; }
.endhead b { font-size: 60px; font-weight: 600; letter-spacing: -0.03em; }
.endcard h2 { margin: 26px 0 0; font-size: 128px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
.endsub { margin: 26px 0 0 !important; font-size: 30px !important; line-height: 1.4; max-width: 980px; color: #4A4843 !important; }
.endchips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.endchip { padding: 10px 18px; border-radius: 999px; background: #FFFFFF; border: 1px solid var(--line); font-size: 25px; font-weight: 500; }
.endtot, .endtot2 { font-family: var(--mono); margin: 24px 0 0 !important; font-size: 20px !important; white-space: nowrap; color: var(--grey) !important; }
.endtot2 { margin-top: 8px !important; }
.endfoot { margin: 30px 0 0 !important; font-size: 25px !important; color: var(--ink) !important; font-weight: 500; }
.endr { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.endqr { width: 380px; height: 380px; padding: 18px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 10px 34px rgba(20,20,19,.12); }
.endqr svg { width: 100%; height: 100%; display: block; }
.endtry { margin: 0 !important; font-size: 24px !important; color: var(--ink) !important; }
.score { top: 22px; left: auto; min-width: 290px; padding: 12px 16px 10px; border-radius: 14px; background: rgba(255,255,255,.94); border: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(20,20,19,.14); font-size: 19px; }
.srow { display: flex; justify-content: space-between; gap: 24px; padding: 3px 0; color: var(--ink); }
.srow span { color: var(--grey); }
.srow b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.snote { display: flex; align-items: center; gap: 8px; margin-top: 7px; padding: 5px 9px; border-radius: 8px; font-family: var(--mono); font-size: 16px; color: var(--coral-ink); }
.lock { width: 10px; height: 8px; border: 2px solid var(--coral-ink); border-radius: 2px; position: relative; top: 2px; }
.lock::before { content: ''; position: absolute; left: 0; top: -8px; width: 6px; height: 6px; border: 2px solid var(--coral-ink); border-bottom: 0; border-radius: 5px 5px 0 0; }
.chapters { top: 22px; display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.92); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(20,20,19,.12); }
.chap { padding: 6px 15px; border-radius: 999px; font-size: 19px; font-weight: 500; color: #A6A29A; }
.chap.done { color: var(--ink); }
.chap.cur { background: var(--coral); color: #FFFFFF; }
.compare { display: flex; gap: 22px; top: auto; }
.tile { width: 560px; padding: 22px 26px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 14px 44px rgba(20,20,19,.22); }
.tile.us { border: 2px solid var(--coral); }
.tile small { display: block; font-family: var(--mono); font-size: 17px; color: var(--grey); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 10px; }
.trow { display: flex; align-items: baseline; gap: 12px; padding: 4px 0; }
.trow b { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; min-width: 150px; }
.trow span { font-size: 22px; color: var(--grey); }
.tile.us .trow b { color: var(--coral-ink); }
.scrim { width: 1920px; height: 1080px; background: rgba(20,20,19,.45); }
.saved { display: flex; flex-direction: column; gap: 10px; }
.sv { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 8px 26px rgba(20,20,19,.16); font-size: 25px; font-weight: 500; }
.sv span { font-family: var(--mono); font-size: 16px; text-transform: uppercase; color: var(--grey); min-width: 80px; }
.sv.b { border: 2px solid var(--coral); }
.sv.b span { color: var(--coral-ink); }
.sv em { font-style: normal; font-family: var(--mono); font-size: 15px; padding: 3px 9px; border-radius: 999px; border: 1px dashed var(--coral); color: var(--coral-ink); }
.badges { display: flex; gap: 10px; }
.badges span { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px; background: #FFFFFF; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(20,20,19,.14); font-size: 22px; font-weight: 500; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="compose.js"></script>
</body>
</html>
