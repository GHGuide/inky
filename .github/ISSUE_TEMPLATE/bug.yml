name: Something doesn't work
description: A bug, a crash, or a message that wasn't true
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: If a bot was involved, paste what it said in its chat.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: "1. … 2. … 3. …"
  - type: input
    id: version
    attributes:
      label: Inky version
      description: More → Settings shows it at the bottom.
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux, A server (install.sh or Docker)]
    validations: { required: true }
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. gemma3:12b in Ollama, or a cloud key
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The end of engine.log in your Inky folder. Check it for anything private first.
      render: text
