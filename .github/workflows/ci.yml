# Offline checks on every push: no keys, no spend. The Playwright UI check (app/static/check_ui.py) is skipped.
name: offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync
      # data-offline/ is git-ignored, and app/test_serve.py reads it: build it from fixtures first.
      - name: offline build (fixtures, fixed rules, n8n dry run)
        run: uv run python build.py --offline
      - name: pipeline
        run: uv run python test_pipeline.py
      - name: app server
        run: uv run python app/test_serve.py

  # Inky bots engine + UI server: unit tests (local fixture site, fake models, no keys) on all three OSes.
  inky:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: browser
        shell: bash
        run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: unit tests
        run: uv run python -m unittest discover -s tests -t . -v

  # The macOS menu bar app must keep compiling.
  inkybar:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: native/mac/build.sh
