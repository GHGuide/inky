<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inky</title>
<style>
  html,body{margin:0;height:100%;background:#F7F6F3;color:#1D1A17;font-family:Geist,-apple-system,system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  svg{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
  p{color:#6B6862;margin:0}.err{color:#C2502F;max-width:460px}
  @media (prefers-reduced-motion:reduce){svg{animation:none}}
  @media (prefers-color-scheme:dark){html,body{background:#1A1917;color:#EDEBE6}p{color:#A8A49C}.err{color:#F29A82}}
</style></head>
<body><main>
  <svg width="110" height="110" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#E86F51" stroke-width="11" stroke-linecap="round"><path d="M34 76 C 28 92, 16 98, 20 110"/><path d="M47 80 C 45 96, 38 104, 42 114"/><path d="M60 82 C 62 98, 56 106, 60 114"/><path d="M73 80 C 75 96, 82 104, 78 114"/><path d="M86 76 C 92 92, 104 98, 100 110"/></g><ellipse cx="60" cy="52" rx="38" ry="36" fill="#E86F51"/><ellipse cx="46" cy="54" rx="5.5" ry="7.5" fill="#1D1A17"/><ellipse cx="74" cy="54" rx="5.5" ry="7.5" fill="#1D1A17"/><circle cx="48" cy="51" r="2" fill="#fff"/><circle cx="76" cy="51" r="2" fill="#fff"/><path d="M54 66 Q60 72 66 66" fill="none" stroke="#1D1A17" stroke-width="3" stroke-linecap="round"/></svg>
  <h1 style="margin:0;font-size:26px">Waking up your bots…</h1><p id="msg">Starting Inky on this computer.</p>
</main>
<script>
  window.showError = (e) => { const m = document.getElementById("msg"); m.className = "err"; m.textContent = "Inky couldn’t start: " + e + ". Quit and open it again, or run python -m inky."; };
</script></body></html>
